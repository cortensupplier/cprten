<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900"><title>SPA-H plate ordering dimensions</title><desc>Technical illustration of a rectangular plate with length, width and thickness references. Not to scale.</desc><defs><linearGradient id="steel" x2="1" y2="1"><stop stop-color="#bc815e"/><stop offset="1" stop-color="#704630"/></linearGradient><marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto-start-reverse"><path d="M0 0 8 4 0 8z" fill="#cba98b"/></marker></defs><rect width="1200" height="900" fill="#292723"/><text x="90" y="110" font-family="Arial,sans-serif" font-size="28" letter-spacing="5" fill="#ceb99e">MATERIAL ORDERING GUIDE</text><text x="85" y="235" font-family="Arial,sans-serif" font-size="100" font-weight="bold" fill="#f6efe5">SPA-H</text><text x="90" y="290" font-family="Arial,sans-serif" font-size="30" fill="#ceb99e">JIS G 3125 · PLATE / SHEET</text><path d="M190 480 720 370 1030 535 500 665z" fill="url(#steel)" stroke="#d5ac87" stroke-width="3"/><path d="M190 480 500 665 500 695 190 510z" fill="#754631"/><path d="M500 665 1030 535 1030 565 500 695z" fill="#573c2e"/><g stroke="#cba98b" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"><path d="M515 748 1040 618"/><path d="M120 540 430 720"/></g><g font-family="Arial,sans-serif" fill="#f6efe5" font-size="25"><text x="760" y="743">LENGTH</text><text x="120" y="685">WIDTH</text><text x="885" y="460">THICKNESS</text><text x="595" y="540" transform="rotate(-14 595 540)">HEAT ID</text></g><path d="M945 473 1010 550" fill="none" stroke="#f6efe5" stroke-width="2"/><text x="90" y="835" font-family="Arial,sans-serif" font-size="22" fill="#b9aa98">SPECIFY SIZE · QUANTITY · INSPECTION   /   NOT TO SCALE</text></svg>